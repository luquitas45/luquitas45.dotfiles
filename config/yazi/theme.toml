# name: GORGOROTH colors for Yazi (port a yazi 26)
# url: https://github.com/metalelf0/black-metal.nvim (extras/yazi/gorgoroth.toml)
# port: formato 26 — colores hex soportados; lo no listado hereda el preset
#:schema https://yazi-rs.github.io/schemas/theme.json

[flavor]
dark  = ""
light = ""

[mgr]
cwd = { fg = "#888888" }

find_keyword  = { fg = "#5f8787", italic = true }
find_position = { fg = "#5f8787", italic = true }

marker_copied   = { fg = "#ddeecc" }
marker_cut      = { fg = "#5f8787" }
marker_selected = { fg = "#5f8787" }

count_cut      = { fg = "#5f8787", bg = "#000000" }
count_copied   = { fg = "#5f8787", bg = "#000000" }
count_selected = { fg = "#5f8787", bg = "#000000" }

border_symbol = "│"
border_style  = { fg = "#505050" }

[tabs]
active   = { fg = "#5f8787", bg = "#222222" }
inactive = { fg = "#505050", bg = "#222222" }

[mode]
normal_main = { fg = "#000000", bg = "#aaaaaa", bold = true }
normal_alt  = { fg = "#000000", bg = "#aaaaaa", bold = true }
select_main = { fg = "#000000", bg = "#999999", bold = true }
select_alt  = { fg = "#000000", bg = "#999999", bold = true }
unset_main  = { fg = "#000000", bg = "#ddeecc", bold = true }
unset_alt   = { fg = "#000000", bg = "#ddeecc", bold = true }

[status]
sep_left  = { open = "", close = "", fg = "#222222", bg = "#222222" }
sep_right = { open = "", close = "", fg = "#222222", bg = "#222222" }

progress_label  = { fg = "#5f8787", bold = true }
progress_normal = { fg = "#5f8787", bg = "#222222" }
progress_error  = { fg = "#000000", bg = "#5f8787" }

perm_sep   = { fg = "#9b99a3" }
perm_type  = { fg = "#c1c1c1" }
perm_read  = { fg = "#888888" }
perm_write = { fg = "#5f8787" }
perm_exec  = { fg = "#aaaaaa" }

[input]
border   = { fg = "#505050" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#505050" }
active   = { fg = "#999999" }
inactive = {}

[tasks]
border  = { fg = "#505050" }
title   = {}
hovered = { underline = true }

[which]
border          = { fg = "#505050" }
mask            = { bg = "#000000" }
cand            = { fg = "#c1c1c1" }
rest            = { fg = "#9b8d7f" }
desc            = { fg = "#ddeecc" }
separator       = "  "
separator_style = { fg = "#9b99a3" }

[help]
border  = { fg = "#505050" }
chord   = { fg = "#9b8d7f" }
action  = { fg = "#ddeecc" }
hovered = { fg = "#c1c1c1", bg = "#000000", bold = true }

[filetype]
rules = [
  # Media
  { mime = "**/image/*", fg = "#9b8d7f" },
  { mime = "**/{audio,video}/*", fg = "#ddeecc" },
  # Archives
  { mime = "**/application/{zip,gzip}", fg = "#5f8787" },
  { mime = "**/application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#5f8787" },
  # Fallback
  { url = "*", fg = "#c1c1c1" },
  { url = "*/", fg = "#888888" },
]