# Add the user's personal bin dirs to the session PATH so autostarted apps that
# resolve commands by name find them (e.g. Yakuake's Konsole profile Command
# "sess-open SAPE", which Konsole looks up via PATH). Without this, a fresh
# login's systemd --user session has the distro base PATH and no ~/.local/bin.
#
# %h expands to $HOME, ${PATH} references the imported session PATH.
# Putting ~/.local/bin first also makes sess-open resolve even if ${PATH} were
# left literal (a nonexistent trailing PATH component is just skipped).
PATH=%h/.local/bin:%h/.pi/agent/bin:${PATH}