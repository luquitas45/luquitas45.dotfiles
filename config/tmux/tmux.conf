# ============================================================
# tmux config — optimizada para trabajo con LazyVim
# Prefijo: C-a · Barra arriba · Tema Gorgoroth
# ============================================================

# ── Prefijo y terminal ──
set -g prefix C-a
unbind C-b
bind C-a send-prefix        # C-a + C-a → pasa Ctrl+A real a la app (vim/readline)
set -s escape-time 10       # nvim sin lag al salir de insert

# Pi (y otras TUIs) interpretan el teclado según TERM: con screen-256color
# solo conocen Enter=\r y pierden Ctrl+J/shift+enter. Con xterm-kitty usan
# el parseo completo CSI u (como en kitty directo).
set -g default-terminal "xterm-kitty"

# ── Recarga de config ──
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config recargado"

# ── Sesiones y ventanas ──
bind s choose-tree -Zw                                          # árbol sesiones/ventanas (zoom)
bind N command-prompt -p "nombre de sesión:" "new-session -s '%%' -c '#{pane_current_path}'"
bind X confirm-before -p "¿matar sesión #S? (s/n)" kill-session
bind B switch-client -l                                         # volver a la sesión anterior (back)
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind n next-window
bind p previous-window
set -g renumber-windows on        # sin huecos al cerrar ventanas

# ── Splits y panes ──
bind | split-window -h -c "#{pane_current_path}"   # split vertical (lado a lado)
bind - split-window -v -c "#{pane_current_path}"   # split horizontal (arriba/abajo)
bind -r H resize-pane -L 5        # resize en pasos de 5 (repetibles)
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,ON,off}"

# ── Navegación y modo copia ──
# Cruce tmux ↔ nvim SIN prefijo: C-h/j/k/l (plugin vim-tmux-navigator, ver Plugins).
# El lado nvim vive en ~/.config/nvim/lua/config/keymaps.lua
set -g mode-keys vi
bind Escape copy-mode           # C-a Escape además de C-a [
bind -T copy-mode-vi v send -X begin-selection
if-shell "command -v wl-copy" "bind -T copy-mode-vi y send -X copy-pipe-and-cancel wl-copy"
if-shell "command -v wl-copy" "bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel wl-copy"
set -g copy-mode-match-style "bg=#aaaaaa,fg=#000000"
set -g copy-mode-current-match-style "bg=#5f8787,fg=#000000"

# ── Popups ──
bind f display-popup -w 80% -h 80% -E "tmux new-session -A -s scratch"   # terminal flotante persistente
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit   # lazygit flotante

# ── Comodidad ──
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# ── Compatibilidad con apps ──
set -g focus-events on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g history-limit 50000

# ── Apariencia: tema Gorgoroth ──
# name: GORGOROTH colors for Tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/gorgoroth.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Paleta
set -g @black   "#2a2325"
set -g @grey    "#505050"
set -g @red     "#5f8787"
set -g @orange  "#aaaaaa"
set -g @green   "#c1c1c1"
set -g @yellow  "#888888"
set -g @blue    "#aaaaaa"
set -g @purple  "#999999"
set -g @magenta "#9b8d7f"
set -g @cyan    "#ddeecc"
set -g @white   "#c1c1c1"

# Tema
set -g @theme_bg     "#000000"
set -g @theme_fg     "#c1c1c1"
set -g @theme_alt_bg "#2a2325"
set -g @theme_alt    "#5f8787"
set -g @theme_comment "#505050"
set -g @theme_visual "#222222"
set -g @theme_line   "#000000"

set -g status on
set -g status-interval 1    # contador en vivo
set -g status-position top
set -g status 3
# Barra de estado: arriba, fondo del terminal (default), ventanas pegadas a la sesión
set -g status-style "bg=default,fg=#c1c1c1"
set -g status-left "  #S  "
set -g status-left-style "bg=#2a2325,fg=#c1c1c1"
set -g status-left-length 30
set -g status-right " #[bg=#2a2325,fg=#c1c1c1] ⏱ #(~/.local/bin/session-uptime) "
set -g status-right-style "bg=default,fg=#505050"
# Header en 3 filas: [0] margen en blanco · [1] sesion+tabs · [2] divisor ▁
# La fila 1 reproduce el formato por defecto de la barra (movido a esa fila).
set -g status-format[0] " "                    # margen arriba: respira
set -g status-format[1] "#[bg=default]#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
# Fila 2: divisor. La repetimos muy por encima de cualquier ancho real:
# tmux recorta al ancho del cliente, así siempre cruza la línea completa.
set -g status-format[2] "#[fg=#2a2325]▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁"

# Ventanas: la activa se distingue solo por el color del texto
set -g window-status-style "bg=#000000,fg=#c1c1c1"
set -g window-status-current-style "bg=#c1c1c1,fg=#2a2325"
set -g window-status-activity-style "bg=default,fg=#aaaaaa"
set -g window-status-bell-style "bg=default,fg=#5f8787"
set -g window-status-format "  #I:#W "
set -g window-status-current-format "  #I:#W "

# Panes: bordes unificados; etiqueta del pane abajo
set -g pane-border-style "fg=#2a2325"
set -g pane-active-border-style "fg=#2a2325"
set -g pane-border-lines double
set -g pane-border-status bottom
set -g pane-border-format ""

# Mensajes / modo / reloj  (todo alineado a la paleta)
set -g message-style "bg=#222222,fg=#c1c1c1"
set -g message-command-style "bg=#222222,fg=#5f8787"   # prompt ':' (antes fg=yellow)
set -g mode-style "bg=#aaaaaa,fg=#000000"
set -g clock-mode-colour "#5f8787"

# Menú de comandos (Tab) — antes bg=yellow
set -g menu-style "bg=#2a2325,fg=#c1c1c1"
set -g menu-selected-style "bg=#5f8787,fg=#000000"
set -g menu-border-style "fg=#5f8787"

# Popups (scratch C-a f / lazygit C-a g)
set -g popup-style "bg=#000000,fg=#c1c1c1"
set -g popup-border-style "fg=#5f8787"
set -g popup-border-lines single

# Overlay de números de panel (C-a q) — antes azul/rojo
set -g display-panes-colour "#888888"
set -g display-panes-active-colour "#5f8787"

# Copy mode — estilos que faltaban (antes rojo/blanco/amarillo)
set -g copy-mode-selection-style "bg=#5f8787,fg=#000000"
set -g copy-mode-mark-style "fg=#5f8787"
set -g copy-mode-line-number-style "fg=#888888"
set -g copy-mode-current-line-number-style "fg=#5f8787"
set -g copy-mode-position-style "bg=#222222,fg=#c1c1c1"

# ── Pi dentro de tmux: renglón nuevo con Ctrl+J ──
# tmux NO normaliza C-j: el \n llega al pane y Pi lo toma como newline.
# (Un bind $'\n' viejo mandaba 0 bytes y comía la tecla — por eso NO se bindea.)
# Shift/Alt+Enter: kitty no las emite sin keyboard protocol (Pi no lo pide).

# ── Plugins (TPM) ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l cruza panes tmux y splits nvim
set -g @plugin 'tmux-plugins/tmux-resurrect'      # C-a C-s guarda, C-a C-r restaura
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-guardado + restaurar al arrancar

set -g @resurrect-strategy-nvim 'session'         # restaura sesiones de nvim
set -g @continuum-restore 'on'                    # restaura solo al iniciar tmux

# Inicializar TPM (tiene que quedar al final del archivo)
run '~/.tmux/plugins/tpm/tpm'
